<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Gen 5 - Interactive Battle Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #060606;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            user-select: none;
        }

        #game-container {
            width: 640px;
            height: 450px;
            position: relative;
            border: 4px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        /* DYNAMIC ARENA BACKGROUNDS */
        .arena-bg { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; }
        .arena-wallace { background: radial-gradient(circle at 50% 30%, #16365c 0%, #050d18 80%); }
        .arena-steven { background: radial-gradient(circle at 50% 30%, #403830 0%, #1c1815 80%); }
        .arena-red { background: linear-gradient(to bottom, #e2e8f0 0%, #94a3b8 60%, #475569 100%); }

        .weather-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        .snow-particle { position: absolute; background: #fff; border-radius: 50%; opacity: 0.8; animation: fall linear infinite; }
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(460px) translateX(60px); }
        }

        /* PERFECTED BATTLE PLATFORMS POSITIONING */
        .platform { position: absolute; border-radius: 50%; transform: scaleY(0.38); z-index: 2; }
        .plat-wallace { background: radial-gradient(ellipse, rgba(82,190,255,0.85) 0%, rgba(13,38,71,0.95) 70%); border: 3px solid #4da6ff; }
        .plat-steven { background: radial-gradient(ellipse, #706050 0%, #2d2520 70%); border: 3px solid #a08870; }
        .plat-red { background: radial-gradient(ellipse, #f1f5f9 0%, #cbd5e1 70%); border: 3px solid #fff; }

        #enemy-platform { bottom: 210px; right: 40px; width: 200px; height: 80px; }
        #player-platform { bottom: 115px; left: 30px; width: 260px; height: 100px; }

        /* SCREENS SYSTEM */
        .screen {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            box-sizing: border-box; z-index: 5; background-color: #1e293b;
            padding: 15px; display: flex; flex-direction: column; align-items: center;
        }

        #trainer-screen { justify-content: center; }
        #trainer-screen h2, #selection-screen h2, #item-screen h2 { color: #fff; font-size: 10px; margin-bottom: 15px; text-shadow: 2px 2px #000; text-align: center; line-height: 1.4; }
        
        .trainer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 580px; }
        .trainer-card {
            background-color: #334155; border: 3px solid #fff; border-radius: 8px;
            padding: 8px; cursor: pointer; text-align: center; color: white; font-size: 7px; transition: 0.2s;
        }
        .trainer-card:hover { transform: scale(1.05); background-color: #0284c7; }
        .trainer-card img { height: 75px; image-rendering: pixelated; margin-bottom: 5px; }

        #selection-screen { background-color: #14532d; display: none; }
        .grid-wrapper { width: 100%; height: 290px; overflow-y: auto; padding-right: 4px; }
        .grid-selection { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        
        .pkmn-card {
            background-color: #f8fafc; border: 2px solid #1e293b; border-radius: 5px;
            display: flex; flex-direction: column; align-items: center; padding: 4px; cursor: pointer;
        }
        .pkmn-card.selected { background-color: #4ade80; border-color: #fff; box-shadow: 0 0 10px #fff; }
        .pkmn-card img { width: 50px; height: 50px; image-rendering: pixelated; }
        .pkmn-info { font-size: 7px; color: #111; margin-top: 2px; font-weight: bold; text-align: center; }

        #goto-items-btn {
            margin-top: 12px; width: 60%; padding: 10px; background-color: #ea580c;
            color: #fff; border: 2px solid #fff; border-radius: 4px; font-size: 8px; cursor: pointer; display: none;
        }

        #item-screen { background-color: #312e81; display: none; justify-content: center; }
        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 500px; height: 290px; overflow-y: auto; padding-right: 5px; }
        .item-card {
            background-color: #1e1b4b; border: 3px solid #6366f1; border-radius: 6px; padding: 10px;
            color: #fff; cursor: pointer; transition: 0.2s; text-align: left;
        }
        .item-card:hover { background-color: #4338ca; border-color: #fff; }
        .item-name { font-size: 9px; color: #facc15; font-weight: bold; margin-bottom: 6px; }
        .item-desc { font-size: 7px; line-height: 1.4; color: #e2e8f0; }

        /* CALIBRATED BATTLE SCREEN VIEWPORT */
        #battle-screen { display: none; background: transparent; z-index: 3; padding: 0; }

        .sprite { position: absolute; image-rendering: pixelated; z-index: 3; transform-origin: bottom center; transition: filter 0.1s, transform 0.2s; }
        #enemy-sprite { bottom: 225px; right: 90px; height: 100px; }
        #player-sprite { bottom: 130px; left: 90px; height: 130px; }

        /* HUDS LAYOUT */
        .hud {
            position: absolute; background-color: #fcfce0; border: 3px solid #334155;
            border-radius: 6px; padding: 6px 10px; width: 210px; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); font-size: 8px; z-index: 4;
        }
        #enemy-hud { top: 30px; left: 30px; }
        #player-hud { bottom: 150px; right: 30px; }

        .hp-bar-container { width: 100%; height: 6px; background-color: #475569; border: 1px solid #1e293b; border-radius: 3px; margin-top: 5px; }
        .hp-bar { height: 100%; background-color: #22c55e; width: 100%; transition: width 0.3s ease; }
        .hp-text { text-align: right; margin-top: 3px; font-size: 7px; color: #1e293b; }
        .party-dots { margin-top: 4px; font-size: 7px; letter-spacing: 1px; color: #475569; }
        .hud-item-tag { font-size: 6px; color: #b45309; margin-top: 2px; font-weight: bold; text-transform: uppercase; }

        /* DIALOG BOX & COLORED BUTTONS MENU */
        #dialog-box {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 115px;
            background-color: #fff; border-top: 4px solid #1e293b; box-sizing: border-box;
            padding: 15px; font-size: 9px; line-height: 1.6; display: flex;
            justify-content: space-between; align-items: center; z-index: 6;
        }
        #message { width: 52%; color: #0f172a; word-wrap: break-word; }
        .menu-container { width: 45%; display: none; flex-wrap: wrap; gap: 5px; }
        
        button.game-btn {
            font-family: 'Press Start 2P', cursive; font-size: 7px; background-color: #f8fafc;
            border: 2px solid #1e293b; border-radius: 4px; padding: 10px 0; cursor: pointer;
            width: calc(50% - 3px); box-sizing: border-box; text-align: center; font-weight: bold;
        }
        button.game-btn:hover { filter: brightness(0.9); }
        button.back-btn { width: 100% !important; background-color: #fecdd3 !important; color: #9f1239 !important; }

        /* NEW: SWITCH MENU UI WITH SPRITES */
        #menu-switch { width: 100%; display: none; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 5px; align-items: center; }
        .switch-card {
            background-color: #f8fafc; border: 2px solid #1e293b; border-radius: 5px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 4px; cursor: pointer; min-width: 75px; box-sizing: border-box; transition: 0.2s;
        }
        .switch-card:hover:not(.disabled) { background-color: #e2e8f0; transform: translateY(-2px); }
        .switch-card.disabled { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        .switch-card img { width: 45px; height: 45px; image-rendering: pixelated; }
        .switch-card span { font-size: 6px; font-weight: bold; margin-bottom: 4px; color: #0f172a; }
        .switch-card .hp-bar-container { width: 90%; height: 4px; margin: 0; }

        /* GRAPHICAL PARTICLE LAYER */
        .vfx-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 4; }
        .vfx-burst { position: absolute; border-radius: 50%; pointer-events: none; animation: burst-out 0.4s ease-out forwards; }
        @keyframes burst-out {
            0% { transform: scale(0.2); opacity: 1; filter: brightness(2); }
            100% { transform: scale(3.2); opacity: 0; filter: brightness(1); }
        }

        /* MOTIONS AND PHYSICS ENGINE CLASSES */
        .dash-p { transform: translate(50px, -25px) scale(1.05) !important; }
        .dash-e { transform: translate(-50px, 25px) scale(1.05) !important; }
        .hurt-recoil { transform: translate(-20px, 10px) rotate(-6deg) !important; filter: brightness(2) sepia(1) saturate(4) hue-rotate(-50deg) !important; }
        .hurt-recoil-e { transform: translate(20px, -10px) rotate(6deg) !important; filter: brightness(2) sepia(1) saturate(4) hue-rotate(-50deg) !important; }
        .faint-slide { transform: translateY(180px) !important; opacity: 0; transition: all 0.6s ease-in; }
        .screen-shake { animation: shake 0.25s linear; }

        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-6px, 5px); } 50% { transform: translate(6px, -5px); } 75% { transform: translate(-4px, -4px); } }
    </style>
</head>

                <div class="hp-bar-container"><div id="enemy-hp-bar" class="hp-bar"></div></div>
                <div class="party-dots" id="enemy-party"></div>
            </div>
            <img id="enemy-sprite" class="sprite" src="" alt="Enemy">

            <div id="player-hud" class="hud">
                <div id="player-name">???</div>
                <div class="hp-bar-container"><div id="player-hp-bar" class="hp-bar"></div></div>
                <div id="player-hp-text" class="hp-text">0/0</div>
                <div class="party-dots" id="player-party"></div>
                <div id="player-item-tag" class="hud-item-tag">Item: None</div>
            </div>
            <img id="player-sprite" class="sprite" src="" alt="Player">

            <div id="dialog-box">
                <div id="message">Booting systems...</div>
                
                <div id="menu-main" class="menu-container">
                    <button class="game-btn" onclick="openSubMenu('moves')">FIGHT</button>
                    <button class="game-btn" onclick="openSubMenu('switch')">SWITCH</button>
                    <button class="game-btn" onclick="openSubMenu('potion')">POTION</button>
                    <button class="game-btn" style="color:#aaa;" disabled>RUN</button>
                </div>
                <div id="menu-moves" class="menu-container"></div>
                <div id="menu-switch"></div>
            </div>
        </div>

        function triggerSnowWeather(enable) {
            const wBox = document.getElementById("weather-box"); wBox.innerHTML = "";
            if (!enable) return;
            for (let i = 0; i < 20; i++) {
                let s = document.createElement("div"); s.className = "snow-particle";
                s.style.left = Math.random() * 640 + "px"; s.style.top = Math.random() * -450 + "px";
                s.style.width = s.style.height = (3 + Math.random() * 4) + "px";
                s.style.animationDuration = (2 + Math.random() * 3) + "s";
                wBox.appendChild(s);
            }
        }

        function buildPokemonGrid() {
            const grid = document.getElementById("selection-grid"); grid.innerHTML = "";
            pokemonPool.forEach((p, idx) => {
                grid.innerHTML += `
                    <div class="pkmn-card" id="card-${idx}" onclick="toggleSelect(${idx})">
                        <img src="https://play.pokemonshowdown.com/sprites/gen5/${p.name.toLowerCase()}.png">
                        <div class="pkmn-info">${p.name}</div>
                    </div>
                `;
            });
        }

        function toggleSelect(idx) {
            let card = document.getElementById(`card-${idx}`);
            let foundIndex = selectedKeys.indexOf(idx);
            if (foundIndex > -1) {
                selectedKeys.splice(foundIndex, 1); card.classList.remove("selected");
            } else if (selectedKeys.length < 6) {
                selectedKeys.push(idx); card.classList.add("selected");
            }
            document.getElementById("count-txt").innerText = `(${selectedKeys.length}/6)`;
            document.getElementById("goto-items-btn").style.display = selectedKeys.length === 6 ? "block" : "none";
        }

        function openItemSelection() {
            document.getElementById("selection-screen").style.display = "none";
            document.getElementById("item-screen").style.display = "flex";
            
            const injector = document.getElementById("items-injector");
            injector.innerHTML = BattleItems.map(item => `
                <div class="item-card" onclick="confirmAllSystems('${item.id}')">
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.desc}</div>
                </div>
            `).join("");
        }

        function confirmAllSystems(itemId) {
            chosenCombatItem = itemId;
            playerTeam = selectedKeys.map(idx => {
                let p = pokemonPool[idx];
                return { name: p.name, type: p.type, maxHp: p.maxHp, hp: p.maxHp, moves: p.moves, sitrusConsumed: false };
            });
            
            const matchedItem = BattleItems.find(i => i.id === itemId);
            document.getElementById("player-item-tag").innerText = `Item: ${matchedItem.name}`;

            document.getElementById("item-screen").style.display = "none";
            document.getElementById("battle-screen").style.display = "block";
            initBattle();
        }

        function initBattle() {

            narrate(`${enemyTrainer.title} wants to battle!`, () => {

                    });
                });
            });
        }

        function setPokemonSprites() {
            let pSpr = document.getElementById("player-sprite");
            let eSpr = document.getElementById("enemy-sprite");
            pSpr.src = `https://play.pokemonshowdown.com/sprites/gen5ani-back/${playerTeam[pActive].name.toLowerCase()}.gif`;
            eSpr.src = `https://play.pokemonshowdown.com/sprites/gen5ani/${enemyTeam[eActive].name.toLowerCase()}.gif`;
            pSpr.style.transform = "scale(1)"; eSpr.style.transform = "scale(1)";
        }

        function updateUI() {
            let p = playerTeam[pActive]; let e = enemyTeam[eActive];

            document.getElementById("player-name").innerText = p.name;
            document.getElementById("player-hp-text").innerText = `${p.hp}/${p.maxHp}`;
            let pPct = (p.hp / p.maxHp) * 100;
            document.getElementById("player-hp-bar").style.width = pPct + "%";
            setBarColor(document.getElementById("player-hp-bar"), pPct);

            document.getElementById("enemy-name").innerText = e.name;
            let ePct = (e.hp / e.maxHp) * 100;
            document.getElementById("enemy-hp-bar").style.width = ePct + "%";
            setBarColor(document.getElementById("enemy-hp-bar"), ePct);

            document.getElementById("player-party").innerHTML = "PM: " + playerTeam.map(pk => pk.hp > 0 ? "⬤" : "◯").join("");
            document.getElementById("enemy-party").innerHTML = "RIVAL: " + enemyTeam.map(pk => pk.hp > 0 ? "⬤" : "◯").join("");
        }

        function setBarColor(bar, pct) {
            bar.style.backgroundColor = pct > 50 ? "#22c55e" : pct > 20 ? "#eab308" : "#ef4444";
        }

        function narrate(text, callback) {
            closeAllMenus(); 
            document.getElementById("message").style.display = "block";
            document.getElementById("message").innerHTML = text;
            if (callback) setTimeout(callback, 1800);
        }

        function closeAllMenus() {
            document.querySelectorAll(".menu-container").forEach(m => m.style.display = "none");
            document.getElementById("menu-switch").style.display = "none";
        }

        function openSubMenu(menu) {
            closeAllMenus();
            if(!isPlayerTurn && menu !== 'main') return;
            
            if (menu === 'main') {
                document.getElementById("message").style.display = "block";
                document.getElementById("menu-main").style.display = "flex";
                document.getElementById("message").innerHTML = `What will<br>${playerTeam[pActive].name} do?`;
            } else if (menu === 'moves') {
                document.getElementById("message").style.display = "block";
                let div = document.getElementById("menu-moves");
                div.innerHTML = playerTeam[pActive].moves.map(m => {
                    let btnColor = typeColors[m.t] || "#64748b";
                    return `<button class="game-btn" style="background-color:${btnColor}; color:white; text-shadow:1px 1px 2px #000; border-color:#0f172a;" onclick="executePlayerMove('${m.n}', ${m.d}, '${m.t}')">${m.n}</button>`;
                }).join("");
                div.innerHTML += `<button class="game-btn back-btn" onclick="openSubMenu('main')">BACK</button>`;
                div.style.display = "flex";
            } else if (menu === 'switch') {
                document.getElementById("message").style.display = "none"; // Hide dialog for horizontal layout
                let div = document.getElementById("menu-switch");
                
                div.innerHTML = playerTeam.map((pk, idx) => {
                    let disabled = (pk.hp <= 0 || idx === pActive) ? 'disabled' : '';
                    let pct = (pk.hp / pk.maxHp) * 100;
                    let barColor = pct > 50 ? "#22c55e" : pct > 20 ? "#eab308" : "#ef4444";
                    return `
                    <div class="switch-card ${disabled}" onclick="switchActivePokemon(${idx})">
                        <img src="https://play.pokemonshowdown.com/sprites/gen5/${pk.name.toLowerCase()}.png">
                        <span>${pk.name}</span>
                        <div class="hp-bar-container"><div class="hp-bar" style="width:${pct}%; background-color:${barColor};"></div></div>
                    </div>`;
                }).join("");
                
                div.innerHTML += `<button class="game-btn back-btn" style="min-width:65px; height:70px;" onclick="openSubMenu('main')">BACK</button>`;
                div.style.display = "flex";
            } else if (menu === 'potion') {
                if(potionsLeft > 0) { executePotion(); } else { narrate("No potions left!", () => openSubMenu('main')); }
            }
        }

        // VFX Animations Keep Same
        function triggerAdvancedVfx(type, isEnemyTarget) {
            const canvas = document.getElementById("vfx-canvas"); canvas.innerHTML = "";
            const targetSprite = document.getElementById(isEnemyTarget ? "enemy-sprite" : "player-sprite");
            const tX = isEnemyTarget ? 490 : 160; const tY = isEnemyTarget ? 160 : 245;
            targetSprite.classList.add(isEnemyTarget ? "hurt-recoil-e" : "hurt-recoil");
            setTimeout(() => targetSprite.classList.remove("hurt-recoil", "hurt-recoil-e"), 300);

            if (type === "fire") {
                for(let i=0; i<12; i++) setTimeout(() => { let p = document.createElement("div"); p.className = "vfx-burst"; p.style.left = (tX - 20 + Math.random()*50) + "px"; p.style.top = (tY - 50 + Math.random()*50) + "px"; p.style.width = p.style.height = (20 + Math.random()*20) + "px"; p.style.background = "radial-gradient(circle, #f97316, #ef4444, transparent)"; canvas.appendChild(p); }, i*25);
            } else if (type === "water") {
                for(let i=0; i<3; i++) setTimeout(() => { let p = document.createElement("div"); p.className = "vfx-burst"; p.style.left = (tX - 10) + "px"; p.style.top = (tY - 70) + "px"; p.style.width = "75px"; p.style.height = "75px"; p.style.borderRadius = "30% 30% 50% 50%"; p.style.background = "linear-gradient(to top, #3b82f6, #1d4ed8)"; canvas.appendChild(p); }, i * 100);
            } else if (type === "grass") {
                for(let i=0; i<10; i++) setTimeout(() => { let p = document.createElement("div"); p.className = "vfx-burst"; p.style.left = (tX + Math.random()*40) + "px"; p.style.top = (tY - 60 + Math.random()*40) + "px"; p.style.width = "25px"; p.style.height = "8px"; p.style.borderRadius = "50% 0 50% 0"; p.style.background = "#22c55e"; p.style.transform = `rotate(${Math.random()*360}deg)`; canvas.appendChild(p); }, i*30);
            } else if (type === "electric") {
                targetSprite.style.filter = "brightness(3) saturate(3)"; setTimeout(() => targetSprite.style.filter = "none", 250);
                for(let i=0; i<5; i++) { let p = document.createElement("div"); p.className = "vfx-burst"; p.style.left = (tX - 20 + Math.random()*40) + "px"; p.style.top = (tY - 60 + Math.random()*40) + "px"; p.style.width = "40px"; p.style.height = "40px"; p.style.border = "3px dashed #eab308"; canvas.appendChild(p); }
            } else {
                let p = document.createElement("div"); p.className = "vfx-burst"; p.style.left = (tX - 20) + "px"; p.style.top = (tY - 60) + "px"; p.style.width = p.style.height = "55px"; p.style.background = "radial-gradient(circle, #fff, #64748b, transparent)"; canvas.appendChild(p);
            }
        }

        function calculateDamage(moveType, targetType, baseDmg, isPlayerAttacking) {
            let multiplier = 1; let text = "";

            if (typeChart[moveType] && typeChart[moveType][targetType] !== undefined) multiplier = typeChart[moveType][targetType];

            if (multiplier === 2) text = "<br>It's super effective!";
            if (multiplier === 0.5) text = "<br>It's not very effective...";
            if (multiplier === 0) text = "<br>It doesn't affect the opponent...";

            let variance = 0.85 + Math.random() * 0.3;
            let finalDmg = Math.floor(baseDmg * multiplier * variance);

            if (multiplier > 0) {
                if (isPlayerAttacking) {
                    if (chosenCombatItem === "expertbelt" && multiplier === 2) { finalDmg = Math.floor(finalDmg * 1.4); text += "<br>[Expert Belt boosted hit!]"; }
                    if (chosenCombatItem === "lifeorb") { finalDmg = Math.floor(finalDmg * 1.3); }
                    if (chosenCombatItem === "choiceband") { finalDmg = Math.floor(finalDmg * 1.5); text += "<br>[Choice Band power!]"; }
                    if (chosenCombatItem === "muscleband") { finalDmg = Math.floor(finalDmg * 1.15); }
                }
                if (!isPlayerAttacking && chosenCombatItem === "assaultvest") { finalDmg = Math.floor(finalDmg * 0.7); text += "<br>[Assault Vest mitigated!]"; }
            } else { finalDmg = 0; }

            return { damage: finalDmg, message: text, mult: multiplier };
        }

        function executePlayerMove(name, baseDmg, type) {
            isPlayerTurn = false;
            let pSprite = document.getElementById("player-sprite");
            let container = document.getElementById("game-container");
            let target = enemyTeam[eActive]; let user = playerTeam[pActive];

            pSprite.classList.add("dash-p");
            narrate(`${user.name} used<br>${name}!`, () => {
                pSprite.classList.remove("dash-p");
                let combat = calculateDamage(type, target.type, baseDmg, true);
                
                if (combat.mult > 0) {
                    triggerAdvancedVfx(type, true);
                    if (baseDmg >= 60 || type === "ground") container.classList.add("screen-shake");
                }
                
                target.hp -= combat.damage; if (target.hp < 0) target.hp = 0;
                updateUI();

                setTimeout(() => {
                    container.classList.remove("screen-shake");
                    let hitMsg = combat.mult === 0 ? combat.message : `${user.name} dealt ${combat.damage} damage!${combat.message}`;
                    
                    narrate(hitMsg, () => {
                        let skipEnemyTurn = false;

                        if (chosenCombatItem === "kingsrock" && combat.damage > 0 && Math.random() < 0.20) {
                            skipEnemyTurn = true;
                            narrate(`[King's Rock] caused ${target.name} to flinch!`, () => { postPlayerMoveChecks(target, skipEnemyTurn); });
                        } else if (chosenCombatItem === "lifeorb" && combat.mult > 0) {
                            user.hp -= 15; if(user.hp < 0) user.hp = 0;
                            updateUI();
                            narrate(`[Life Orb] recoil hurt<br>${user.name}!`, () => { postPlayerMoveChecks(target, skipEnemyTurn); });
                        } else if (chosenCombatItem === "shellbell" && combat.damage > 0) {
                            let heal = Math.floor(combat.damage * 0.25);
                            user.hp += heal; if (user.hp > user.maxHp) user.hp = user.maxHp;
                            updateUI();
                            narrate(`[Shell Bell] drained and healed for +${heal} HP!`, () => { postPlayerMoveChecks(target, skipEnemyTurn); });
                        } else {
                            postPlayerMoveChecks(target, skipEnemyTurn);
                        }
                    });
                }, 600);
            });
        }

        function postPlayerMoveChecks(target, skipEnemyTurn = false) {
            let user = playerTeam[pActive];
            if (user.hp <= 0) {
                document.getElementById("player-sprite").classList.add("faint-slide");
                setTimeout(handlePlayerFaint, 600); return;
            }

            if (target.hp <= 0) {
                document.getElementById("enemy-sprite").classList.add("faint-slide");
                setTimeout(handleEnemyFaint, 600);
            } else {
                if (user.hp <= user.maxHp * 0.5 && user.hp > 0 && !user.sitrusConsumed && chosenCombatItem === "sitrusberry") {
                    let h = Math.floor(user.maxHp * 0.3); user.hp += h; if(user.hp > user.maxHp) user.hp = user.maxHp;
                    user.sitrusConsumed = true; updateUI();
                    narrate(`[Sitrus Berry] restored ${user.name}'s health!`, () => { skipEnemyTurn ? (isPlayerTurn = true, openSubMenu('main')) : enemyTurn(); });
                } else if (chosenCombatItem === "leftovers" && user.hp < user.maxHp) {
                    user.hp += 15; if (user.hp > user.maxHp) user.hp = user.maxHp; updateUI();
                    narrate(`[Leftovers] restored<br>HP to ${user.name}!`, () => { skipEnemyTurn ? (isPlayerTurn = true, openSubMenu('main')) : enemyTurn(); });
                } else {
                    skipEnemyTurn ? (isPlayerTurn = true, openSubMenu('main')) : enemyTurn();
                }
            }
        }

        function enemyTurn() {
            let e = enemyTeam[eActive]; let target = playerTeam[pActive];

            if (chosenCombatItem === "brightpowder" && Math.random() < 0.15) {
                narrate(`${target.name} dodged the incoming attack using Bright Powder!`, () => {
                    postEnemyMoveChecks(e);
                });
                return;
            }

            let move = e.moves[Math.floor(Math.random() * e.moves.length)];
            let eSprite = document.getElementById("enemy-sprite");
            let container = document.getElementById("game-container");
            
            eSprite.classList.add("dash-e");
            narrate(`${enemyTrainer.name}'s ${e.name} used<br>${move.n}!`, () => {
                eSprite.classList.remove("dash-e");
                let combat = calculateDamage(move.t, target.type, move.d, false);
                
                if (combat.mult > 0) {
                    triggerAdvancedVfx(move.t, false);
                    if(move.d >= 60) container.classList.add("screen-shake");
                }
                
                // Focus Band Check
                let fatal = target.hp - combat.damage <= 0;
                if (fatal && chosenCombatItem === "focusband" && Math.random() < 0.15) {
                    target.hp = 1; combat.message += "<br>[Focus Band protected you!]";
                } else {
                    target.hp -= combat.damage; if (target.hp < 0) target.hp = 0;
                }
                updateUI();

                setTimeout(() => {
                    container.classList.remove("screen-shake");
                    let hitMsg = combat.mult === 0 ? combat.message : `${e.name} dealt ${combat.damage} damage!${combat.message}`;
                    
                    narrate(hitMsg, () => {
                        if (chosenCombatItem === "rockyhelmet" && target.hp > 0 && combat.mult > 0) {
                            e.hp -= 20; if (e.hp < 0) e.hp = 0; updateUI();
                            narrate(`[Rocky Helmet] punished<br>${e.name} for 20 damage!`, () => { postEnemyMoveChecks(e); });
                        } else {
                            postEnemyMoveChecks(e);
                        }
                    });
                }, 600);
            });
        }

        function postEnemyMoveChecks(enemy) {
            let target = playerTeam[pActive];
            if (enemy.hp <= 0) {
                document.getElementById("enemy-sprite").classList.add("faint-slide");
                setTimeout(handleEnemyFaint, 600); return;
            }

            if (target.hp <= 0) {
                document.getElementById("player-sprite").classList.add("faint-slide");
                setTimeout(handlePlayerFaint, 600);
            } else {
                if (target.hp <= target.maxHp * 0.5 && target.hp > 0 && !target.sitrusConsumed && chosenCombatItem === "sitrusberry") {
                    let h = Math.floor(target.maxHp * 0.3); target.hp += h; if(target.hp > target.maxHp) target.hp = target.maxHp;
                    target.sitrusConsumed = true; updateUI();
                    narrate(`[Sitrus Berry] restored ${target.name}'s health!`, () => { isPlayerTurn = true; openSubMenu('main'); });
                } else {
                    isPlayerTurn = true; openSubMenu('main');
                }
            }
        }

        function switchActivePokemon(idx) {
            isPlayerTurn = false;
            document.getElementById("player-sprite").classList.add("faint-slide");
            narrate(`Come back, ${playerTeam[pActive].name}!`, () => {
                pActive = idx;
                setPokemonSprites();
                updateUI();
                narrate(`Go, ${playerTeam[pActive].name}!`, () => { enemyTurn(); });
            });
        }

        function executePotion() {
            isPlayerTurn = false; potionsLeft--;
            let p = playerTeam[pActive]; p.hp += 150; if (p.hp > p.maxHp) p.hp = p.maxHp;
            updateUI();
            narrate(`Used Max Potion!<br>Restored HP to ${p.name}.`, () => { enemyTurn(); });
        }

        function handleEnemyFaint() {
            document.getElementById("enemy-sprite").classList.remove("faint-slide");
            narrate(`${enemyTeam[eActive].name} fainted!`, () => {
                eActive++;
                if (eActive >= enemyTeam.length) {
                    narrate(`You defeated ${enemyTrainer.title}!<br>You are the absolute Master! 🏆🎉`, null);
                } else {
                    narrate(`${enemyTrainer.name} is about to send out ${enemyTeam[eActive].name}.`, () => {
                        setPokemonSprites(); updateUI();
                        isPlayerTurn = true; openSubMenu('main');
                    });
                }
            });
        }

        function handlePlayerFaint() {
            document.getElementById("player-sprite").classList.remove("faint-slide");
            narrate(`${playerTeam[pActive].name} fainted!`, () => {
                let hasAlive = playerTeam.some(pk => pk.hp > 0);
                if (!hasAlive) {
                    narrate("You run out of usable Pokémon...<br>You blacked out! Game Over.", null);
                } else {
                    closeAllMenus();
                    document.getElementById("message").style.display = "none";
                    let div = document.getElementById("menu-switch");
                    
                    div.innerHTML = playerTeam.map((pk, idx) => {
                        let disabled = pk.hp <= 0 ? 'disabled' : '';
                        let pct = (pk.hp / pk.maxHp) * 100;
                        let barColor = pct > 50 ? "#22c55e" : pct > 20 ? "#eab308" : "#ef4444";
                        return `
                        <div class="switch-card ${disabled}" onclick="forceSwitchActive(${idx})">
                            <img src="https://play.pokemonshowdown.com/sprites/gen5/${pk.name.toLowerCase()}.png">
                            <span>${pk.name}</span>
                            <div class="hp-bar-container"><div class="hp-bar" style="width:${pct}%; background-color:${barColor};"></div></div>
                        </div>`;
                    }).join("");
                    
                    div.style.display = "flex";
                }
            });
        }

        function forceSwitchActive(idx) {
            pActive = idx; setPokemonSprites(); updateUI();
            narrate(`Go, ${playerTeam[pActive].name}!`, () => {
                isPlayerTurn = true; openSubMenu('main');
            });
        }
    </script>
</body>
</html>
